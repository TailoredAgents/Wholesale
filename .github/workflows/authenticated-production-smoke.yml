name: Authenticated Production Smoke

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: authenticated-production-smoke
  cancel-in-progress: true

jobs:
  authenticated-smoke:
    name: Critical authenticated CRM routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Store this workflow's credentials in a GitHub Environment restricted to
    # main. Scheduled workflows always execute the default branch, so repository
    # code from a manually selected ref can never receive the Clerk master key.
    environment: production-smoke
    # Production monitoring must not become a failed check on the commit that
    # Render needs to deploy in order to repair production.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Authenticated smoke is disabled
        if: ${{ vars.AUTHENTICATED_SMOKE_ENABLED != 'true' }}
        run: echo "Set AUTHENTICATED_SMOKE_ENABLED=true in the production-smoke environment to enable this monitor."

      - name: Check authenticated API and CRM routes
        id: authenticated_smoke
        if: ${{ vars.AUTHENTICATED_SMOKE_ENABLED == 'true' }}
        continue-on-error: true
        env:
          API_BASE_URL: https://api.stonegatehb.com
          WEB_BASE_URL: https://www.stonegatehb.com
          CLERK_SECRET_KEY: ${{ secrets.PRODUCTION_SMOKE_CLERK_SECRET_KEY }}
          SMOKE_CLERK_USER_ID: ${{ secrets.PRODUCTION_SMOKE_CLERK_USER_ID }}
        run: node scripts/authenticated-smoke.mjs

      - name: Record authenticated monitor result without blocking deploys
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SMOKE_ENABLED: ${{ vars.AUTHENTICATED_SMOKE_ENABLED || 'false' }}
          SMOKE_OUTCOME: ${{ steps.authenticated_smoke.outcome }}
        with:
          script: |
            const marker = "<!-- stonegate-authenticated-production-smoke -->";
            const enabled = process.env.SMOKE_ENABLED === "true";
            const failed = enabled && process.env.SMOKE_OUTCOME !== "success";
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (failed) {
              const body = [
                marker,
                "The Stonegate authenticated production smoke monitor needs attention.",
                "",
                `- Last failure: ${new Date().toISOString()}`,
                `- Workflow run: ${runUrl}`,
                "",
                "This monitor records an issue instead of failing the commit check so a repair deploy cannot be blocked by the broken production version it is replacing.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: "Authenticated production smoke monitor is failing",
                  body,
                });
              }
              core.warning("The authenticated production smoke command did not pass.");
              return;
            }

            if (existing) {
              const reason = enabled
                ? "The authenticated production smoke monitor recovered."
                : "The authenticated production smoke monitor was disabled.";
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `${reason} ${new Date().toISOString()}. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
