name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Audit dependencies
        run: uv run pip-audit --strict --desc=off --progress-spinner=off

      - name: Check operational scripts
        run: bash -n ../../scripts/db-backup.sh ../../scripts/db-restore-verify.sh ../../scripts/operations-alert-test.sh ../../scripts/smoke-test.sh

      - name: Typecheck
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Audit dependencies
        run: npm audit --workspaces=false --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check OS information architecture contract
        run: npm run audit:ia

      - name: Check underwriting workspace contract
        run: npm run audit:underwriting

      - name: Build
        run: npm run build
