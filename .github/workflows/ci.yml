name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Audit dependencies
        run: uv run pip-audit --strict --desc=off --progress-spinner=off

      - name: Check operational scripts
        run: bash -n ../../scripts/db-backup.sh ../../scripts/db-restore-verify.sh ../../scripts/operations-alert-test.sh ../../scripts/smoke-test.sh

      - name: Test deployment gate scripts
        run: uv run python -m unittest discover -s ../../scripts/tests -p "test_*.py"

      - name: Validate Render Blueprint structure
        run: uv run --with pyyaml python ../../scripts/validate-render-blueprint.py ../../render.yaml

      - name: Compare Render Blueprint with official schema
        continue-on-error: true
        run: uv run --with pyyaml --with jsonschema python ../../scripts/validate-render-blueprint.py ../../render.yaml --official

      - name: Typecheck regression gate
        run: uv run python ../../scripts/check-mypy-baseline.py --baseline mypy-baseline.json

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Audit dependencies
        run: npm audit --workspaces=false --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test authenticated smoke harness
        working-directory: ${{ github.workspace }}
        run: node --test scripts/authenticated-smoke.test.mjs

      - name: Check all web contracts
        run: npm run audit:contracts

      - name: Build
        run: npm run build
