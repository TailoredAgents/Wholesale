name: Production Readiness

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail after the smoke test to verify owner notifications"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  smoke:
    name: Stonegate production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API, worker readiness, and public pages
        env:
          API_BASE_URL: https://api.stonegatehb.com
          WEB_BASE_URL: https://www.stonegatehb.com
        run: bash scripts/smoke-test.sh

      - name: Controlled alert-path failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Controlled failure requested for readiness alert verification."
          exit 1
