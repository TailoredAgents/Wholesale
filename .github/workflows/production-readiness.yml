name: Production Readiness

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  smoke:
    name: Stonegate production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API, worker readiness, and public pages
        env:
          API_BASE_URL: https://oakwell-api.onrender.com
          WEB_BASE_URL: https://www.stonegatehomebuyer.com
        run: bash scripts/smoke-test.sh

