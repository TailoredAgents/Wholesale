  - type: web
    name: oakwell-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm ci --workspaces=false && npm run build
    startCommand: npm run start
    envVars:
      - key: API_BASE_URL
        value: https://api.stonegatehb.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.stonegatehb.com
      - key: NEXT_PUBLIC_META_PIXEL_ID
